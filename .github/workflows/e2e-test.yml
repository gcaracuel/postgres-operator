name: E2E Test

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: End-to-End Test
    timeout-minutes: 30 # Add timeout to prevent hanging jobs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # was: actions/checkout@v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # was: docker/setup-buildx-action@v4.2.0
      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # was: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: |
            postgres-operator:build
      - name: Install kubectl & krew
        uses: marcofranssen/setup-kubectl@8f613b4ebeb3f0385c1f8119e0af4a3eed67730e # was: marcofranssen/setup-kubectl@v3.0.0
        with:
          enablePlugins: true
      - name: Install KUTTL
        run: kubectl krew install kuttl
      - name: Run tests
        run: kubectl kuttl test --config ./tests/kuttl-test-self-hosted-postgres.yaml
      - name: Upload test artifacts
        if: always() # Run even if tests fail
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # was: actions/upload-artifact@v7.0.1
        with:
          name: test-results
          path: tests/kind-logs-*/
          retention-days: 7
