name: Release Charts

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # was: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # was: azure/setup-helm@v5.0.1
        with:
          version: v3.18.2

      - name: Set chart version from git tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Extract tag name, strip 'v' prefix if present
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "Setting chart version to $VERSION"
          sed -i "s/^version:.*/version: $VERSION/" charts/ext-postgres-operator/Chart.yaml
          sed -i 's/^appVersion:.*/appVersion: "'"$VERSION"'"/' charts/ext-postgres-operator/Chart.yaml

      - name: Verify chart version
        run: |
          grep -E '^(version|appVersion):' charts/ext-postgres-operator/Chart.yaml

      - name: Package Helm chart
        run: |
          helm package charts/ext-postgres-operator --destination .cr-release-packages

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # was: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Charts to GHCR
        run: |
          for pkg in .cr-release-packages/*; do
            if [ -z "${pkg:-}" ]; then
              break
            fi
            helm push "${pkg}" oci://ghcr.io/${{ github.repository }}/charts
          done
