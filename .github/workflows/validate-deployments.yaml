name: Validate Deployment methods

on:
  push:
    branches:
      - master
    paths:
      - "charts/ext-postgres-operator/**"
      - "config/**"
  pull_request:
    branches:
      - master
    paths:
      - "charts/ext-postgres-operator/**"
      - "config/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-helm:
    name: Validate Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # was: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # was: azure/setup-helm@v5.0.1
        with:
          version: "latest"

      - name: Lint Helm chart
        run: helm lint ./charts/ext-postgres-operator

      - name: Template Helm chart
        run: helm template ext-postgres-operator ./charts/ext-postgres-operator > /dev/null

  validate-kustomize:
    name: Validate Kustomize Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # was: actions/checkout@v7.0.1

      - name: Validate Kustomize configuration
        run: kustomize build ./config/default > /dev/null
